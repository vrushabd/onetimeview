<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-8327032298153859">

    <!-- Primary SEO Meta Tags -->
    <title>Create Secret - One Time View Link Generator</title>
    <meta name="description" content="Free one time view link generator. Create secure, self-destructing links for passwords, notes, and files that auto-delete after viewing. No sign-up required.">
    <meta name="keywords" content="one time view link generator, one time view, onetimeview, self destruct message, share password securely, one time link, ephemeral file sharing">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://onetimeview.app/create">

    <!-- Mobile & Theme -->
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/tailwind-config.js?v=2"></script>
    <script src="/static/config.js?v=3"></script>
    <script src="/static/cookie-consent.js" defer></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #ededed;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
        textarea, input, select {
            background-color: #111111;
            border: 1px solid #3f3f46;
            color: #ededed;
            border-radius: 8px;
            padding: 16px 20px !important;
            font-size: 14px;
            transition: border-color 0.15s ease;
            width: 100%;
        }
        textarea:focus, input:focus, select:focus {
            outline: none; border-color: #71717a;
        }
        ::placeholder { color: #71717a; }
        .type-btn.active {
            background-color: #ffffff;
            color: #000000;
        }

        /* Fix for the secret link input right padding to avoid text under button */
        #secretLink {
            padding-right: 100px !important;
        }
    </style>
</head>

<body class="bg-background min-h-screen text-text-primary">
    <!-- Navigation -->
    <nav class="border-b border-card-border sticky top-0 z-40 bg-background/95 backdrop-blur-sm">
        <div class="container mx-auto px-6 py-4 flex items-center gap-4 flex-wrap md:flex-nowrap justify-between">
            <a href="/" class="flex items-center gap-3 font-semibold text-white tracking-tight text-lg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                OneTimeView
            </a>
            <div class="flex gap-6 md:gap-8 text-sm font-medium">
                <a href="/" class="text-text-secondary hover:text-white transition-colors">Home</a>
                <a href="/privacy" class="text-text-secondary hover:text-white transition-colors">Privacy</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-12">
        <div class="max-w-2xl mx-auto">

            <!-- Success Message -->
            <div id="successMessage" class="hidden bg-surface border border-card-border rounded-xl p-8 mb-8">
                <div class="mb-6">
                    <h3 class="text-2xl font-medium text-white">Secret Created</h3>
                    <p class="text-text-secondary mt-1">Your secure link is ready to share.</p>
                </div>

                <div class="relative mb-6">
                    <input type="text" id="secretLink" readonly class="w-full font-mono">
                    <button onclick="copyLink()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white text-black font-medium px-4 py-2 rounded-md hover:bg-gray-100 transition-colors">
                        Copy
                    </button>
                </div>

                <div class="text-sm text-text-secondary mb-6" id="expiryInfo"></div>

                <a href="/create" class="text-sm text-text-secondary hover:text-white transition-colors">
                    ← Create another secret
                </a>
            </div>

            <!-- Form -->
            <form id="secretForm" class="bg-surface border border-card-border rounded-xl">
                <div class="p-8 space-y-8">
                    <div>
                        <h1 class="text-2xl font-medium text-white mb-2">Create a Secret</h1>
                        <p class="text-text-secondary text-sm">Your message will self-destruct after being read once.</p>
                    </div>

                    <!-- Content Type -->
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="selectType('text')" id="btn-text" class="type-btn active rounded-md py-2 text-sm font-medium transition-colors bg-background border border-card-border hover:bg-white/5">Text</button>
                        <button type="button" onclick="selectType('image')" id="btn-image" class="type-btn rounded-md py-2 text-sm font-medium transition-colors bg-background border border-card-border hover:bg-white/5">Image</button>
                        <button type="button" onclick="selectType('video')" id="btn-video" class="type-btn rounded-md py-2 text-sm font-medium transition-colors bg-background border border-card-border hover:bg-white/5">Video</button>
                        <button type="button" onclick="selectType('file')" id="btn-file" class="type-btn rounded-md py-2 text-sm font-medium transition-colors bg-background border border-card-border hover:bg-white/5">File</button>
                    </div>

                    <!-- Text Content -->
                    <div id="textContent">
                        <label class="block text-sm font-medium mb-2 text-white">Your Secret</label>
                        <textarea id="contentField" rows="6" class="font-mono text-sm" placeholder="Enter your secret message, password, or sensitive data..."></textarea>
                    </div>

                    <!-- File Upload -->
                    <div id="fileContent" class="hidden">
                        <label class="block text-sm font-medium mb-2 text-white">Upload File</label>
                        <div class="border border-dashed border-card-border hover:border-text-muted bg-background rounded-xl p-8 text-center cursor-pointer transition-colors"
                            id="uploadArea" onclick="document.getElementById('fileInput').click()" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                            <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
                            <p class="font-medium text-white mb-1">Click to upload or drag and drop</p>
                            <p class="text-xs text-text-muted">Maximum file size 100MB</p>

                            <div id="fileInfo" class="hidden mt-4 text-left border border-card-border p-3 rounded-md">
                                <p class="text-sm font-medium text-white truncate" id="fileName"></p>
                                <p class="text-xs text-text-secondary mt-1" id="fileSize"></p>
                            </div>

                            <div id="uploadProgress" class="hidden mt-4 text-left">
                                <div class="w-full bg-card-border rounded-full h-1 mb-2">
                                    <div id="progressBar" class="bg-white h-full transition-all duration-300" style="width: 0%"></div>
                                </div>
                                <p class="text-xs text-text-secondary" id="progressText">Uploading...</p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-5 border-t border-card-border pt-6">
                        <!-- Password -->
                        <div>
                            <label class="block text-sm font-medium mb-2 text-white">Password Protection (Optional)</label>
                            <input type="password" id="passwordField" class="text-sm" placeholder="Require a password to view">
                        </div>

                        <!-- Settings -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-white">Expiration</label>
                                <select id="expiryField" class="text-sm">
                                    <option value="0">Never expires</option>
                                    <option value="5">5 minutes</option>
                                    <option value="15">15 minutes</option>
                                    <option value="60">1 hour</option>
                                    <option value="1440" selected>24 hours</option>
                                    <option value="10080">7 days</option>
                                </select>
                            </div>
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <label class="block text-sm font-medium text-white">View Limit</label>
                                </div>
                                <input type="number" id="maxViewsField" min="1" max="100" value="1" class="text-sm w-full font-mono">
                            </div>
                        </div>

                        <input type="checkbox" id="isPremium" class="hidden">

                        <button type="submit" class="w-full bg-white text-black font-medium py-3 rounded-md hover:bg-gray-100 transition-colors mt-4">
                            Generate Link
                        </button>
                    </div>
                </div>
            </form>

            <!-- History -->
            <div id="secretOverviewContainer" class="hidden mt-8 bg-surface border border-card-border rounded-xl">
                <div class="p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-medium text-white">Recent Links</h2>
                        <button onclick="clearAllHistory()" class="text-sm text-text-muted hover:text-white transition-colors">Clear History</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-text-secondary border-b border-card-border">
                                <tr>
                                    <th class="px-4 py-2 font-normal">Date</th>
                                    <th class="px-4 py-2 font-normal">Link</th>
                                    <th class="px-4 py-2 font-normal">Status</th>
                                    <th class="px-4 py-2 font-normal">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="secretHistoryList" class="divide-y divide-card-border">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedType = 'text';
        let selectedFile = null;
        const MAX_FILE_SIZE_MB = 100;
        const typeButtons = {};

        document.querySelectorAll('.type-btn').forEach(btn => {
            typeButtons[btn.id.replace('btn-', '')] = btn;
        });

        function selectType(type) {
            selectedType = type;

            Object.values(typeButtons).forEach(btn => {
                btn.classList.remove('active', 'bg-white', 'text-black');
                btn.classList.add('bg-background', 'text-text-primary');
            });
            const activeBtn = typeButtons[type];
            activeBtn.classList.remove('bg-background', 'text-text-primary');
            activeBtn.classList.add('active', 'bg-white', 'text-black');

            const fileInput = document.getElementById('fileInput');
            if (type === 'image') fileInput.setAttribute('accept', 'image/*');
            else if (type === 'video') fileInput.setAttribute('accept', 'video/*');
            else fileInput.setAttribute('accept', '*/*');

            if (type === 'text') {
                document.getElementById('textContent').classList.remove('hidden');
                document.getElementById('fileContent').classList.add('hidden');
            } else {
                document.getElementById('textContent').classList.add('hidden');
                document.getElementById('fileContent').classList.remove('hidden');
            }
        }

        function handleDragOver(e) { e.preventDefault(); e.stopPropagation(); }
        function handleDragLeave(e) { e.preventDefault(); e.stopPropagation(); }
        function handleDrop(e) {
            e.preventDefault(); e.stopPropagation();
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        }
        function handleFileSelect(e) {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        }

        function handleFile(file) {
            selectedFile = file;
            const sizeMb = file.size / 1024 / 1024;

            if (sizeMb > MAX_FILE_SIZE_MB) {
                selectedFile = null;
                document.getElementById('fileInfo').classList.add('hidden');
                document.getElementById('fileInput').value = '';
                alert(`Maximum allowed size is ${MAX_FILE_SIZE_MB} MB.`);
                return;
            }
            document.getElementById('fileInfo').classList.remove('hidden');
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = `${sizeMb.toFixed(2)} MB`;
        }

        // Upload file through the backend (which uploads to Backblaze B2)
        function uploadFileViaBackend(file, contentType, password, expiryMinutes, maxViews, isPremium, onProgress) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('content_type', contentType);
                formData.append('file', file);
                if (password) formData.append('password', password);
                formData.append('expiry_minutes', expiryMinutes);
                formData.append('max_views', maxViews);
                formData.append('is_premium', isPremium);
                const xhr = new XMLHttpRequest();
                xhr.open('POST', API_BASE_URL + '/api/secrets', true);
                if (xhr.upload && onProgress) xhr.upload.onprogress = onProgress;
                xhr.onreadystatechange = function () {
                    if (xhr.readyState === XMLHttpRequest.DONE) {
                        if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
                        else {
                            let detail = xhr.responseText || xhr.statusText || 'Unknown error';
                            try {
                                const parsed = JSON.parse(xhr.responseText);
                                detail = parsed.detail || parsed.error || xhr.responseText;
                            } catch (e) { }
                            reject(new Error(`Upload failed: ${xhr.status} (${API_BASE_URL}) ${detail}`));
                        }
                    }
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(formData);
            });
        }

        document.getElementById('secretForm').addEventListener('submit', async (e) => {
            e.preventDefault();

                const submitButton = document.querySelector('#secretForm button[type="submit"]');
                const uploadProgress = document.getElementById('uploadProgress');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');

            const isPremium = document.getElementById('isPremium').checked;
            const expiryMinutes = parseInt(document.getElementById('expiryField').value);
            const maxViews = parseInt(document.getElementById('maxViewsField').value);
            const password = document.getElementById('passwordField').value || null;

            try {
                submitButton.disabled = true;
                submitButton.classList.add('opacity-50');

                if (selectedType === 'text') {
                    const content = document.getElementById('contentField').value;
                    if (!content.trim()) {
                        showToast('Please enter a message');
                        return;
                    }

                    const formData = new FormData();
                    formData.append('content_type', 'text');
                    formData.append('content', content);
                    formData.append('is_premium', isPremium);
                    formData.append('expiry_minutes', expiryMinutes);
                    formData.append('max_views', maxViews);
                    if (password) formData.append('password', password);

                    const res = await fetch(API_BASE_URL + '/api/secrets', { method: 'POST', body: formData });
                    if (!res.ok) {
                        let detail = await res.text();
                        try {
                            const parsed = JSON.parse(detail);
                            detail = parsed.detail || parsed.error || detail;
                        } catch (e) { }
                        throw new Error(`Failed to create secret: ${res.status} (${API_BASE_URL}) ${detail}`);
                    }
                    const data = await res.json();

                    showSuccess(data, password);
                    return;
                }

                if (!selectedFile) {
                    showToast('Please select a file');
                    return;
                }

                uploadProgress.classList.remove('hidden');
                progressBar.style.width = '0%';
                progressText.textContent = 'Starting upload...';

                const result = await uploadFileViaBackend(
                    selectedFile, selectedType, password,
                    expiryMinutes, maxViews, isPremium,
                    (e) => {
                        if (e.lengthComputable && e.total > 0) {
                            const percent = Math.min(Math.round((e.loaded / e.total) * 100), 99);
                            progressBar.style.width = percent + '%';
                            progressText.textContent = percent >= 99 ? 'Securing file...' : `Uploading... ${percent}%`;
                        }
                    }
                );

                progressBar.style.width = '100%';
                progressText.textContent = 'Done';
                showSuccess(result, password);
            } catch (error) {
                alert(error.message || 'Upload failed.');
                uploadProgress.classList.add('hidden');
            } finally {
                submitButton.disabled = false;
                submitButton.classList.remove('opacity-50');
            }
        });

        function showSuccess(data, password) {
            document.getElementById('secretForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
            document.getElementById('secretLink').value = data.url;

            let viewText = data.max_views === 1 ? 'first view' : `${data.max_views} views`;
            if (data.expires_at) {
                document.getElementById('expiryInfo').textContent = `Expires on ${new Date(data.expires_at).toLocaleString()} or after ${viewText}`;
            } else {
                document.getElementById('expiryInfo').textContent = `Will be deleted after ${viewText}`;
            }
            saveSecretToHistory(data.url, !!password, password);
            document.getElementById('successMessage').scrollIntoView();
        }

        function copyLink() {
            document.getElementById('secretLink').select();
            document.execCommand('copy');
            showToast('Link copied to clipboard!');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-white text-black px-4 py-2 rounded shadow-md z-50 text-sm font-medium';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true' && urlParams.get('url')) {
            const secretUrl = decodeURIComponent(urlParams.get('url'));
            document.getElementById('secretForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
            document.getElementById('secretLink').value = secretUrl;
            document.getElementById('expiryInfo').textContent = 'Will be deleted after first view or in 24 hours';
            saveSecretToHistory(secretUrl, urlParams.get('pwd') === 'true');
            window.history.replaceState({}, document.title, '/create');
        }

        function loadSecretHistory() {
            const history = JSON.parse(localStorage.getItem('secretHistory') || '[]');
            const container = document.getElementById('secretOverviewContainer');
            const list = document.getElementById('secretHistoryList');
            if (history.length === 0) return container.classList.add('hidden');
            container.classList.remove('hidden');
            list.innerHTML = '';

            history.forEach((secret, i) => {
                const dateObj = new Date(secret.date);
                const dateStr = `${dateObj.toLocaleDateString('en-GB')} ${dateObj.getHours()}:${dateObj.getMinutes().toString().padStart(2, '0')}`;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-4 py-3 text-text-muted whitespace-nowrap">${dateStr}</td>
                    <td class="px-4 py-3 font-mono truncate max-w-[200px]"><a href="${secret.url}" target="_blank" class="hover:underline">${secret.url}</a></td>
                    <td class="px-4 py-3 text-text-secondary">${i === 0 ? 'Newest' : (secret.status || 'Active')}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-3 text-text-secondary">
                            ${secret.hasPassword ? `<button onclick="showPassword('${secret.id}')" class="hover:text-white">Password</button>` : ``}
                            <button onclick="copyHistoryLink('${secret.url}')" class="hover:text-white">Copy</button>
                            <button onclick="removeHistoryItem('${secret.id}')" class="text-red-400 hover:text-red-300">Delete</button>
                        </div>
                    </td>
                `;
                list.appendChild(tr);
            });
        }
        window.loadSecretHistory = loadSecretHistory;
        document.addEventListener('DOMContentLoaded', loadSecretHistory);
    </script>
</body>
</html>
